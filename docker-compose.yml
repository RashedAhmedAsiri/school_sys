# Run the whole system on one server:  docker compose up -d   → http://localhost:3000
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://school:school@db:5432/school
      SESSION_SECRET: ${SESSION_SECRET:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-123323}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
volumes:
  pgdata:
